name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and publish tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4.4.0
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Import maintainer GPG key
        env:
          GPG_FINGERPRINT: 82DE44111B30F91F55BCEB1F414687A3CD7E65B9
        run: |
          set -e
          # The unauthenticated /users/<name>/gpg_keys API endpoint returns 403
          # on the runner (anonymous rate limit). github.com/<user>.gpg works
          # without auth and returns all the user's public keys.
          curl -fsSL https://github.com/airvzxf.gpg \
            | gpg --import
          gpg --list-keys "$GPG_FINGERPRINT"

      - name: Verify tag signature
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # Force-fetch the tag explicitly so the annotated tag object is in
          # the local object database (actions/checkout's defaults don't
          # always include it).
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "::error::Tag $GITHUB_REF_NAME is not signed by a trusted key."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run validation gauntlet
        run: npm run validate

      - name: Build tarball
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Use `git archive` to read directly from the tree object — avoids
          # the "file changed as we read it" warning that `tar .` emits when
          # something is still touching the worktree (npm caches, etc.).
          git archive \
              --format=tar.gz \
              --prefix=kimi-ntfy/ \
              --output="kimi-ntfy-${GITHUB_REF_NAME}.tar.gz" \
              HEAD
          # Strip the .github/ directory (we ship actions separately, not
          # with the plugin payload) and the test/ tree (kept in the repo
          # for CI but not needed at install time).
          mkdir -p staging && tar -xzf "kimi-ntfy-${GITHUB_REF_NAME}.tar.gz" -C staging
          rm -rf staging/kimi-ntfy/.github staging/kimi-ntfy/tests staging/kimi-ntfy/coverage
          tar -czf "kimi-ntfy-${GITHUB_REF_NAME}.tar.gz" -C staging kimi-ntfy
          rm -rf staging

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: kimi-ntfy-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
